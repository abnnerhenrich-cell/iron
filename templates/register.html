{% extends "base.html" %}
{% block title %}Cadastro · RPT Metas{% endblock %}
{% block mainclass %}login-page{% endblock %}
{% block content %}
<div class="login-card">
  <div class="logo-box">RPT</div>
  <h1>Criar conta</h1>
  <p class="muted">Cadastre-se para enviar suas metas.</p>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Nome<input name="name" required></label>
    <label>E-mail<input name="email" type="email" required></label>
    <label>Senha<input name="password" type="password" minlength="6" required></label>
    <button class="btn primary" type="submit">Criar conta</button>
  </form>
  <p class="tiny"><a href="{{ url_for('login') }}">Voltar para login</a></p>
</div>
{% endblock %}
