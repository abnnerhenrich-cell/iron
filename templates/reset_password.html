{% extends "base.html" %}
{% block title %}Nova senha · IRON{% endblock %}
{% block mainclass %}login-page{% endblock %}
{% block content %}
<div class="login-card">
  <div class="logo-box logo-box-art"><img src="{{ url_for('static', filename='iron-logo.png') }}?v=43" alt="IRON Brotherhood"></div>
  <span class="eyebrow">NOVA SENHA</span>
  <h1>Redefinir senha</h1>
  <p class="muted">Crie uma nova senha para sua conta.</p>

  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Nova senha<input name="password" type="password" minlength="6" required autocomplete="new-password" placeholder="Mínimo 6 caracteres"></label>
    <label>Confirmar nova senha<input name="confirm_password" type="password" minlength="6" required autocomplete="new-password" placeholder="Digite novamente"></label>
    <button class="btn primary" type="submit">Salvar nova senha</button>
  </form>
</div>
{% endblock %}
