{% extends "base.html" %}
{% block title %}Atualizar entrega{% endblock %}
{% block content %}
<section class="hero admin-hero">
  <div>
    <h1>Registre sua entrega.</h1>
    <div class="hero-kicker"><span class="hero-chip">Meta: {{ cycle['title'] }}</span><span class="hero-chip">Até 3 comprovantes</span></div>
  </div>
</section>

<form method="post" enctype="multipart/form-data" id="multiDeliveryForm">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

  <section class="panel" style="padding:18px">
    <h2>Envie a foto da sua entrega</h2>
    <p class="muted">Fotografe os materiais de forma nítida e separados para permitir a conferência.</p>
  </section>
  <section class="delivery-extra">
    <label class="upload-box">
      <span>COMPROVAÇÕES <b>*</b><small>Até 3 imagens · compressão automática</small></span>
      <input id="imagesInput" name="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required hidden>
      <div class="upload-drop" id="uploadTrigger">
        <strong>＋ Adicionar fotos da entrega</strong>
        <small>Câmera ou galeria · o sistema reduz o tamanho antes de enviar</small>
      </div>
      <div id="filePreview" class="file-preview"></div>
      <div id="uploadStatus" class="upload-status" aria-live="polite"></div>
    </label>
  </section>

  <div class="sticky-submit">
    
    <button class="btn primary delivery-submit" id="submitDelivery" type="submit" disabled>
      Enviar entrega
    </button>
  </div>
</form>

<script>
(() => {
  const form = document.getElementById('multiDeliveryForm');
  const submit = document.getElementById('submitDelivery');
  const fileInput = document.getElementById('imagesInput');
  const trigger = document.getElementById('uploadTrigger');
  const preview = document.getElementById('filePreview');
  const status = document.getElementById('uploadStatus');

  let preparingImages = false;
  let sending = false;

  const setStatus = (text = '', type = '') => {
    if (!status) return;
    status.textContent = text;
    status.className = `upload-status ${type}`.trim();
  };

  const updateButton = () => {
    const hasImage = fileInput.files && fileInput.files.length > 0;
    submit.disabled = sending || preparingImages || !hasImage;
  };

  trigger.addEventListener('click', () => {
    if (!preparingImages && !sending) fileInput.click();
  });

  const loadImage = file => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Imagem incompatível'));
    };
    img.src = url;
  });

  const canvasBlob = (canvas, quality) => new Promise((resolve, reject) => {
    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Falha ao compactar')), 'image/jpeg', quality);
  });

  const compressImage = async file => {
    if (!file.type.startsWith('image/')) throw new Error('Arquivo não é uma imagem');

    const img = await loadImage(file);
    const maxSide = 1280;
    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
    const width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
    const height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);

    // Começa com boa qualidade e reduz somente se necessário.
    let quality = 0.68;
    let blob = await canvasBlob(canvas, quality);
    while (blob.size > 720000 && quality > 0.40) {
      quality -= 0.08;
      blob = await canvasBlob(canvas, quality);
    }

    if (blob.size > 900000) {
      throw new Error('Imagem continua grande após otimização');
    }

    return new File(
      [blob],
      (file.name.replace(/\.[^.]+$/, '') || 'comprovante') + '.jpg',
      { type: 'image/jpeg', lastModified: Date.now() }
    );
  };

  fileInput.addEventListener('change', async () => {
    const chosen = [...fileInput.files];

    if (chosen.length > 3) {
      alert('Escolha no máximo 3 imagens.');
      fileInput.value = '';
      preview.innerHTML = '';
      setStatus('');
      updateButton();
      return;
    }
    if (!chosen.length) {
      preview.innerHTML = '';
      setStatus('');
      updateButton();
      return;
    }

    preparingImages = true;
    submit.textContent = 'Otimizando fotos...';
    setStatus(`Preparando ${chosen.length} foto(s). Aguarde...`, 'working');
    trigger.classList.add('is-busy');
    updateButton();

    try {
      const optimized = [];
      for (let i = 0; i < chosen.length; i++) {
        setStatus(`Otimizando foto ${i + 1} de ${chosen.length}...`, 'working');
        optimized.push(await compressImage(chosen[i]));
      }

      const transfer = new DataTransfer();
      optimized.forEach(file => transfer.items.add(file));
      fileInput.files = transfer.files;

      preview.innerHTML = '';
      let totalBytes = 0;
      optimized.forEach(file => {
        totalBytes += file.size;
        const pill = document.createElement('span');
        pill.textContent = `${file.name} · ${(file.size / 1024).toFixed(0)} KB`;
        preview.appendChild(pill);
      });

      setStatus(
        `${optimized.length} foto(s) pronta(s) · ${(totalBytes / 1024 / 1024).toFixed(1)} MB no total`,
        'ready'
      );
    } catch (err) {
      console.error(err);
      fileInput.value = '';
      preview.innerHTML = '';
      setStatus('Não foi possível otimizar uma foto. Escolha outra imagem e tente novamente.', 'error');
      alert('Uma das fotos não pôde ser preparada. Tente outra foto ou faça uma captura de tela dela.');
    } finally {
      preparingImages = false;
      trigger.classList.remove('is-busy');
      submit.textContent = 'Enviar entrega';
      updateButton();
    }
  });

  form.addEventListener('submit', e => {
    if (sending) {
      e.preventDefault();
      return;
    }
    if (preparingImages) {
      e.preventDefault();
      alert('Aguarde a otimização das fotos terminar.');
      return;
    }
    if (!fileInput.files.length) {
      e.preventDefault();
      alert('Adicione pelo menos uma foto da entrega.');
      return;
    }

    sending = true;
    submit.disabled = true;
    submit.textContent = 'Enviando... não feche esta tela';
    trigger.classList.add('is-busy');
    setStatus('Enviando comprovantes. Em internet móvel isso pode levar alguns segundos.', 'working');

    // Evita segundo clique/segundo submit enquanto a primeira requisição está em andamento.
    form.querySelectorAll('button[type="submit"]').forEach(btn => btn.disabled = true);
  });

  // Se o navegador voltar para esta página pelo cache, libera o formulário novamente.
  window.addEventListener('pageshow', () => {
    sending = false;
    trigger.classList.remove('is-busy');
    submit.textContent = 'Enviar entrega';
    updateButton();
  });

  updateButton();
})();
</script>
{% endblock %}
